# nginx reverse proxy for Duta Firza.
# Install: sudo cp deploy/nginx-dutafirza.conf /etc/nginx/sites-available/dutafirza
#          sudo ln -s /etc/nginx/sites-available/dutafirza /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then provision TLS: sudo certbot --nginx -d dutafirza.com -d www.dutafirza.com
# (certbot rewrites this file to add the 443 server block + HTTP->HTTPS redirect).

server {
    listen 80;
    listen [::]:80;
    server_name dutafirza.com www.dutafirza.com;

    # Large enough for media / PDF / video uploads handled by the app.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
