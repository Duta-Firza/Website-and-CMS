# MongoDB config for Duta Firza.
# Install: back up /etc/mongod.conf, then copy this over it and restart mongod.
#   sudo cp deploy/mongod-dutafirza.conf /etc/mongod.conf
#   sudo systemctl restart mongod
#
# - Data lives on the dedicated SSD persistent disk (see deploy/README.md B2).
# - Bound to localhost only: the app runs on the same VM, so port 27017 is
#   never exposed publicly. Remote seeding/migration goes through an SSH tunnel.
# - cacheSizeGB capped for small RAM (e2-small / 2 GB). Raise if you size up.

storage:
  dbPath: /var/lib/mongodb-data
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1

# Enable auth. Create the admin + app users first (see README B3), otherwise
# you lock yourself out — Mongo allows a localhost-exception only until the
# first user exists.
security:
  authorization: enabled

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
